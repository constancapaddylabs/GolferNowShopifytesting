<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Golfer Now — Nav &amp; Shop Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fairway:#2F3B2A;
    --sage:#6B7A5E;
    --cream:#F3F1DE;
    --sand:#D9CBB0;
    --ink:#1A1A1A;
    --white:#FFFFFF;
    --nav-h:84px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:#111;
    min-height:100vh;
  }

  /* ---------- Hero / stage ---------- */
  .hero{
    position:relative;
    width:100%;
    height:100vh;
    min-height:600px;
    background:
      linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,.05) 30%, rgba(0,0,0,.45) 100%),
      linear-gradient(135deg,#3a4a33 0%,#20261b 60%,#161a12 100%);
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.05) 0, transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,.04) 0, transparent 50%);
    pointer-events:none;
  }
  .hero-placeholder-text{
    position:absolute;
    left:50%; top:58%;
    transform:translate(-50%,-50%);
    color:rgba(243,241,222,.28);
    font-family:'Playfair Display',serif;
    font-size:clamp(28px,5vw,56px);
    letter-spacing:.02em;
    text-align:center;
    width:90%;
    pointer-events:none;
    user-select:none;
  }

  /* ---------- Nav bar ---------- */
  .navbar{
    position:absolute;
    top:0; left:0; right:0;
    z-index:100;
    height:var(--nav-h);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 32px;
  }

  .nav-left{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .logo{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:22px;
    color:var(--cream);
    letter-spacing:.01em;
    margin-right:28px;
    white-space:nowrap;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .logo-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--sand);
    display:inline-block;
  }

  .nav-links{
    display:flex;
    align-items:center;
    gap:6px;
  }

  .nav-link{
    appearance:none;
    background:transparent;
    border:none;
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:500;
    color:var(--cream);
    padding:10px 18px;
    border-radius:999px;
    cursor:pointer;
    transition:background .18s ease, color .18s ease;
    line-height:1;
  }
  .nav-link:hover{
    background:rgba(243,241,222,.12);
  }
  .nav-link.is-active{
    background:var(--sage);
    color:var(--cream);
  }
  .nav-link:focus-visible{
    outline:2px solid var(--sand);
    outline-offset:2px;
  }

  .nav-right{
    display:flex;
    align-items:center;
    gap:20px;
  }

  .login-link{
    font-size:15px;
    font-weight:500;
    color:var(--cream);
    text-decoration:none;
    padding:8px 6px;
    border-radius:8px;
  }
  .login-link:hover{ opacity:.8; }
  .login-link:focus-visible{
    outline:2px solid var(--sand);
    outline-offset:2px;
  }

  .btn-cta{
    appearance:none;
    border:none;
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:600;
    background:var(--cream);
    color:var(--ink);
    padding:11px 24px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    transition:transform .15s ease, background .15s ease;
  }
  .btn-cta:hover{ background:var(--white); transform:translateY(-1px); }
  .btn-cta:focus-visible{
    outline:2px solid var(--sand);
    outline-offset:2px;
  }

  /* ---------- Hamburger (mobile) ---------- */
  .hamburger{
    display:none;
    appearance:none;
    background:transparent;
    border:none;
    cursor:pointer;
    width:40px;
    height:40px;
    border-radius:8px;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:5px;
  }
  .hamburger:focus-visible{
    outline:2px solid var(--sand);
    outline-offset:2px;
  }
  .hamburger span{
    display:block;
    width:22px;
    height:2px;
    background:var(--cream);
    border-radius:2px;
  }

  /* ---------- Desktop Shop menu panel ---------- */
  .shop-menu-wrap{
    position:absolute;
    top:calc(var(--nav-h) - 8px);
    left:32px;
    z-index:90;
  }

  .shop-menu{
    width:400px;
    max-width:90vw;
    max-height:min(560px, 70vh);
    background:var(--fairway);
    border-radius:20px;
    padding:16px;
    overflow-y:auto;
    box-shadow:0 12px 32px rgba(0,0,0,.28);

    opacity:0;
    transform:translateY(-10px);
    pointer-events:none;
    transition:opacity .2s ease-out, transform .2s ease-out;
  }
  .shop-menu.is-open{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }

  .shop-menu::-webkit-scrollbar{ width:8px; }
  .shop-menu::-webkit-scrollbar-thumb{ background:rgba(243,241,222,.18); border-radius:8px; }
  .shop-menu::-webkit-scrollbar-track{ background:transparent; }

  .product-row{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    background:transparent;
    border:none;
    text-align:left;
    padding:10px;
    border-radius:14px;
    cursor:pointer;
    transition:background .15s ease;
    font-family:inherit;
  }
  .product-row:hover,
  .product-row:focus-visible{
    background:var(--sage);
  }
  .product-row:focus-visible{
    outline:2px solid var(--sand);
    outline-offset:2px;
  }

  .thumb{
    flex:0 0 auto;
    width:80px;
    height:80px;
    border-radius:14px;
    background:var(--sage);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .product-row:hover .thumb,
  .product-row:focus-visible .thumb{
    background:rgba(243,241,222,.18);
  }
  .thumb svg{
    width:36px;
    height:36px;
    opacity:.85;
  }

  .row-text{
    display:flex;
    flex-direction:column;
    gap:5px;
    min-width:0;
  }
  .row-label{
    font-size:13px;
    font-weight:500;
    color:var(--sand);
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .row-badge{
    display:inline-flex;
    align-self:flex-start;
    align-items:center;
    font-size:12px;
    font-weight:600;
    color:var(--ink);
    background:var(--sand);
    padding:3px 10px;
    border-radius:999px;
    letter-spacing:.01em;
  }
  .row-name{
    font-size:16px;
    font-weight:500;
    color:var(--cream);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* ---------- Mobile drawer ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:150;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .overlay.is-open{
    opacity:1;
    pointer-events:auto;
  }

  .drawer{
    position:fixed;
    top:0; left:0;
    bottom:0;
    width:min(360px, 86vw);
    background:var(--fairway);
    z-index:200;
    transform:translateX(-100%);
    transition:transform .28s ease;
    display:flex;
    flex-direction:column;
    padding:20px 16px;
    overflow-y:auto;
  }
  .drawer.is-open{
    transform:translateX(0);
  }

  .drawer-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
  }
  .drawer-logo{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:20px;
    color:var(--cream);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .drawer-close{
    appearance:none;
    background:rgba(243,241,222,.1);
    border:none;
    width:36px;
    height:36px;
    border-radius:10px;
    color:var(--cream);
    font-size:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .drawer-close:focus-visible{
    outline:2px solid var(--sand);
    outline-offset:2px;
  }

  .drawer-links{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-bottom:8px;
  }
  .drawer-link{
    appearance:none;
    background:transparent;
    border:none;
    font-family:'Inter',sans-serif;
    font-size:16px;
    font-weight:500;
    color:var(--cream);
    padding:14px 12px;
    border-radius:12px;
    text-align:left;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .drawer-link.is-active{
    background:var(--sage);
  }
  .drawer-link:focus-visible{
    outline:2px solid var(--sand);
    outline-offset:2px;
  }
  .chevron{
    transition:transform .2s ease;
    opacity:.8;
  }
  .drawer-link.is-active .chevron{
    transform:rotate(180deg);
  }

  .drawer-products{
    display:flex;
    flex-direction:column;
    gap:2px;
    background:rgba(0,0,0,.16);
    border-radius:20px;
    padding:0 10px;
    margin:0 2px 4px;

    max-height:0;
    opacity:0;
    transform:translateY(-8px);
    overflow:hidden;
    pointer-events:none;
    transition:max-height .25s ease-out, opacity .2s ease-out, transform .2s ease-out, padding .25s ease-out;
  }
  .drawer-products.is-open{
    max-height:1000px;
    opacity:1;
    transform:translateY(0);
    padding:10px;
    pointer-events:auto;
  }
  .drawer-products .product-row{
    padding:8px;
  }
  .drawer-products .thumb{
    width:64px;
    height:64px;
    border-radius:12px;
  }
  .drawer-products .thumb svg{
    width:28px; height:28px;
  }

  body.no-scroll{
    overflow:hidden;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 767px){
    .nav-links,
    .nav-right .login-link,
    .shop-menu-wrap{
      display:none;
    }
    .hamburger{ display:flex; }
    .navbar{ padding:0 18px; }
    .logo{ margin-right:0; font-size:19px; }
    .nav-right{ gap:10px; }
    .btn-cta{ padding:9px 18px; font-size:14px; }
  }

  @media (min-width: 768px){
    .hamburger, .overlay, .drawer{ display:none; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-placeholder-text">Placeholder hero image<br>golf training equipment</div>

  <nav class="navbar">
    <div class="nav-left">
      <span class="logo"><span class="logo-dot"></span>Golfer Now</span>
      <div class="nav-links">
        <button type="button" class="nav-link" id="shopTrigger" aria-expanded="false" aria-controls="shopMenu">Shop</button>
        <button type="button" class="nav-link">Training</button>
        <button type="button" class="nav-link">Learn</button>
      </div>
    </div>

    <div class="nav-right">
      <a href="#" class="login-link">Login</a>
      <button type="button" class="btn-cta">Get Started</button>
      <button type="button" class="hamburger" id="hamburgerBtn" aria-expanded="false" aria-controls="mobileDrawer" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Desktop Shop menu panel -->
  <div class="shop-menu-wrap">
    <div class="shop-menu" id="shopMenu" role="menu" aria-label="Shop products">
      <!-- rows injected by JS template, written once here for clarity -->
    </div>
  </div>
</div>

<!-- Mobile drawer -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="mobileDrawer" aria-hidden="true">
  <div class="drawer-header">
    <span class="drawer-logo"><span class="logo-dot" style="background:var(--sand)"></span>Golfer Now</span>
    <button type="button" class="drawer-close" id="drawerClose" aria-label="Close menu">&times;</button>
  </div>

  <div class="drawer-links">
    <button type="button" class="drawer-link" id="drawerShopToggle" aria-expanded="false" aria-controls="drawerProducts">
      Shop
      <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="drawer-products" id="drawerProducts"></div>
    <button type="button" class="drawer-link">Training</button>
    <button type="button" class="drawer-link">Learn</button>
  </div>

  <div style="margin-top:auto; padding-top:20px; display:flex; flex-direction:column; gap:10px;">
    <a href="#" class="login-link" style="text-align:center;">Login</a>
    <button type="button" class="btn-cta" style="width:100%;">Get Started</button>
  </div>
</aside>

<script>
(function(){
  var PRODUCTS = [
    { label:"Swing Trainer", name:"Pro Swing Click Trainer" },
    { label:"Putting", name:"Tour Putting Mirror" },
    { badge:"Save 25%", name:"Starter Bundle" },
    { label:"Alignment", name:"Precision Alignment Sticks" },
    { label:"Accessories", name:"Impact Tape Pack" },
    { badge:"Save 25%", name:"Pro Bundle" }
  ];

  function thumbSVG(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="#F3F1DE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
      + '<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>';
  }

  function renderRow(p){
    var topLine = p.badge
      ? '<span class="row-badge">' + p.badge + '</span>'
      : '<span class="row-label">' + p.label + '</span>';
    return ''
      + '<button type="button" class="product-row" role="menuitem">'
      +   '<span class="thumb">' + thumbSVG() + '</span>'
      +   '<span class="row-text">'
      +     topLine
      +     '<span class="row-name">' + p.name + '</span>'
      +   '</span>'
      + '</button>';
  }

  var rowsHTML = PRODUCTS.map(renderRow).join('');
  document.getElementById('shopMenu').innerHTML = rowsHTML;
  document.getElementById('drawerProducts').innerHTML = rowsHTML;

  // ---------- Desktop Shop menu ----------
  var shopTrigger = document.getElementById('shopTrigger');
  var shopMenu = document.getElementById('shopMenu');
  var shopOpen = false;

  function openShop(){
    shopOpen = true;
    shopMenu.classList.add('is-open');
    shopTrigger.classList.add('is-active');
    shopTrigger.setAttribute('aria-expanded','true');
  }
  function closeShop(){
    shopOpen = false;
    shopMenu.classList.remove('is-open');
    shopTrigger.classList.remove('is-active');
    shopTrigger.setAttribute('aria-expanded','false');
  }
  function toggleShop(){
    shopOpen ? closeShop() : openShop();
  }

  shopTrigger.addEventListener('click', function(e){
    e.stopPropagation();
    toggleShop();
  });

  document.addEventListener('click', function(e){
    if (shopOpen && !shopMenu.contains(e.target) && e.target !== shopTrigger){
      closeShop();
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){
      if (shopOpen) closeShop();
      if (drawerOpen) closeDrawer();
    }
  });

  // ---------- Mobile drawer ----------
  var hamburgerBtn = document.getElementById('hamburgerBtn');
  var drawer = document.getElementById('mobileDrawer');
  var overlay = document.getElementById('overlay');
  var drawerClose = document.getElementById('drawerClose');
  var drawerShopToggle = document.getElementById('drawerShopToggle');
  var drawerProducts = document.getElementById('drawerProducts');
  var drawerOpen = false;

  function openDrawer(){
    drawerOpen = true;
    drawer.classList.add('is-open');
    overlay.classList.add('is-open');
    drawer.setAttribute('aria-hidden','false');
    hamburgerBtn.setAttribute('aria-expanded','true');
    document.body.classList.add('no-scroll');
  }
  function closeDrawer(){
    drawerOpen = false;
    drawer.classList.remove('is-open');
    overlay.classList.remove('is-open');
    drawer.setAttribute('aria-hidden','true');
    hamburgerBtn.setAttribute('aria-expanded','false');
    document.body.classList.remove('no-scroll');
  }

  hamburgerBtn.addEventListener('click', openDrawer);
  drawerClose.addEventListener('click', closeDrawer);
  overlay.addEventListener('click', closeDrawer);

  var drawerShopExpanded = false;
  drawerShopToggle.addEventListener('click', function(){
    drawerShopExpanded = !drawerShopExpanded;
    drawerShopToggle.classList.toggle('is-active', drawerShopExpanded);
    drawerShopToggle.setAttribute('aria-expanded', String(drawerShopExpanded));
    drawerProducts.classList.toggle('is-open', drawerShopExpanded);
  });

  // Collapse mobile drawer state if resized to desktop
  window.addEventListener('resize', function(){
    if (window.innerWidth >= 768 && drawerOpen){
      closeDrawer();
    }
  });
})();
</script>

</body>
</html>
